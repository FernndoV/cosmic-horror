spring.application.name=cosmic-horror-rpg
server.error.include-message=never
ai.provider=${AI_PROVIDER:stub}
ai.openai.api-key=${AZURE_OPENAI_API_KEY}
ai.openai.base-url=${AI_OPENAI_BASE_URL:https://aiproxy.ernidev.com/v1}
ai.openai.model=${AI_OPENAI_MODEL:gpt-5.4-nano}
ai.openai.image-model=${AI_OPENAI_IMAGE_MODEL:gpt-image-2}
ai.openai.image-size=${AI_OPENAI_IMAGE_SIZE:1024x1024}
ai.openai.image-style=${AI_OPENAI_IMAGE_STYLE:tinta, horror cósmico, verde salvia y dorado apagado}
ai.openai.output-format=${AI_OPENAI_IMAGE_OUTPUT_FORMAT:jpeg}
ai.openai.output-compression=${AI_OPENAI_IMAGE_OUTPUT_COMPRESSION:60}
persistence.mode=${PERSISTENCE_MODE:memory}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cosmic_horror}
spring.datasource.username=${DATABASE_USERNAME:cosmic}
spring.datasource.password=${DATABASE_PASSWORD:cosmic_dev_only}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.validate-on-migrate=true